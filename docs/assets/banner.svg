    <text x="120" y="87" fill="#edf3fc" font-size="23" font-weight="700" letter-spacing="3">SLIPCAST / DEV</text>
    <text x="64" y="204" fill="#90decd" font-size="14" font-weight="700" letter-spacing="4">INDEPENDENT DEVELOPER</text>
    <text x="60" y="287" fill="#f3f6fc" font-size="64" font-weight="700" letter-spacing="-2">Building useful</text>
    <text x="60" y="361" fill="#f3f6fc" font-size="64" font-weight="700" letter-spacing="-2">software.</text>
    <text x="64" y="419" fill="#becddd" font-size="21">Native macOS tools. Intelligent automation.</text>
    <text x="64" y="452" fill="#becddd" font-size="21">Thoughtfully built, one useful idea at a time.</text>
    <g fill="#d6e5f4" font-size="13" font-weight="700" letter-spacing="1">
      <rect x="64" y="494" width="87" height="34" rx="17" fill="#29435b"/><text x="107" y="516" text-anchor="middle">SWIFT</text>
      <rect x="161" y="494" width="108" height="34" rx="17" fill="#29435b"/><text x="215" y="516" text-anchor="middle">PYTHON</text>
      <rect x="279" y="494" width="120" height="34" rx="17" fill="#29435b"/><text x="339" y="516" text-anchor="middle">AI AGENTS</text>
    </g>
    <g stroke="url(#line)" stroke-width="2" fill="none" opacity=".7"><path d="M830 230V302H1012V372"/><path d="M830 302V404H764"/></g>
