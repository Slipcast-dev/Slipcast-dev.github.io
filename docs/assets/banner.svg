<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Slipcast / Dev — Building useful software.</title>
  <desc id="desc">Native macOS tools, intelligent automation and AI agents, illustrated as connected application windows on a dark blue background.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1424"/><stop offset="1" stop-color="#1c3150"/></linearGradient>
    <linearGradient id="line" x2="1" y2="1"><stop stop-color="#85dcce"/><stop offset="1" stop-color="#849cff"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#93aecb" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1200" height="630" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="630" rx="24" fill="url(#grid)"/>
  <circle cx="1080" cy="115" r="235" fill="#7b91ff" opacity=".045"/>
  <circle cx="1070" cy="125" r="170" fill="none" stroke="#99adff" stroke-opacity=".15"/>
