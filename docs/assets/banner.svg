      <path d="M720 192H1054" stroke="#506b86"/><circle cx="740" cy="173" r="4" fill="#ed9d9a"/><circle cx="755" cy="173" r="4" fill="#e7c97c"/><circle cx="770" cy="173" r="4" fill="#90decd"/>
      <text x="746" y="229" fill="#90decd" font-size="14" font-weight="700">01 / NATIVE TOOLS</text>
      <text x="746" y="260" fill="#e7eff9" font-size="19">Made for macOS.</text>
