<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="144" viewBox="0 0 1200 144" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio engineering principles</title>
  <desc id="desc">Static by design: no browser JavaScript. Checked before shipping: types and HTML regression tests. Fresh project data: scheduled GitHub synchronization.</desc>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect width="386" height="144" rx="16" fill="#eef3f9"/><rect x="407" width="386" height="144" rx="16" fill="#e8f3f0"/><rect x="814" width="386" height="144" rx="16" fill="#eef0fa"/>
    <g font-size="12" font-weight="700" letter-spacing="2" fill="#40556c"><text x="26" y="37">01 / LIGHTWEIGHT</text><text x="433" y="37">02 / VERIFIED</text><text x="840" y="37">03 / UP TO DATE</text></g>
    <g font-size="23" font-weight="700" fill="#152c43"><text x="26" y="78">Static by design.</text><text x="433" y="78">Checked before shipping.</text><text x="840" y="78">Fresh project data.</text></g>
    <g font-size="15" fill="#40556c"><text x="26" y="113">No JavaScript in the browser.</text><text x="433" y="113">Types, build and HTML checks.</text><text x="840" y="113">Scheduled GitHub synchronization.</text></g>
  </g>
</svg>
