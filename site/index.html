  <title>Личный терминал</title>
  <script>
    // Состояние относится только к текущей вкладке и сохраняется при переходах между страницами.
    try {
      if (sessionStorage.getItem('slipcast-navigation-seen') === '1') {
        document.documentElement.classList.add('navigation-ready');
      }
    } catch {
      // Если браузер запрещает хранилище для локального файла, навигация доступна сразу.
      document.documentElement.classList.add('navigation-ready');
    }
  </script>
  <script src="i18n.js"></script>
  <style>
    .language-switch { position: absolute; z-index: 2; top: 18px; right: 22px; display: flex; gap: 4px; padding: 3px; border: 1px solid #00ff6640; border-radius: 5px; background: #000; }
    .language-switch button { min-height: 38px; min-width: 42px; padding: 6px 10px; border: 1px solid transparent; border-radius: 3px; background: transparent; color: #77a98a; font: inherit; font-size: 12px; cursor: pointer; }
    .language-switch button[aria-pressed="true"] { color: #00ff66; background: #00ff6612; border-color: #00ff6660; }
    .language-switch button:hover { color: #00ff66; background: #00ff661a; }
    :root { color-scheme: dark; --green: #00ff66; --muted: #83b897; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; color: var(--green); font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; }
    .screen { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 88px 24px; }
    .terminal { width: min(1100px, 100%); display: flex; flex-direction: column; align-items: center; text-align: center; }
    /* Единственная строка остаётся по центру и сохраняет полную ширину во время печати. */
    .terminal-output { width: 100%; font-size: min(30px, calc((100vw - 48px) / var(--line-units, 28))); line-height: 1.45; text-align: left; text-shadow: 0 0 14px #00ff6626; }
    .prompt { display: grid; width: max-content; grid-template-columns: 1ch max-content; align-items: start; gap: .55em; margin: 0 auto; min-height: 1.45em; white-space: nowrap; }
    .typed-line { display: grid; min-width: 0; white-space: nowrap; overflow-wrap: normal; word-break: normal; }
    /* Образец сохраняет ширину готовой строки: курсор и буквы не сдвигают центр блока. */
    .typed-line::before { content: attr(data-reserve) " █"; visibility: hidden; grid-area: 1 / 1; }
    .typed-content { grid-area: 1 / 1; }
    .cursor { display: inline-block; width: .57em; height: 1.1em; margin-left: .12em; background: var(--green); vertical-align: -.14em; animation: blink 1s steps(1) infinite; box-shadow: 0 0 12px #00ff6620; }
    @keyframes blink { 50% { opacity: 0; } }
    .navigation { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; width: min(570px, 100%); margin: 44px auto 0; transition: opacity .65s ease, transform .65s ease; }
    .navigation-ready .navigation { transition: none; }
    .navigation.pending { opacity: 0; transform: translateY(12px); visibility: hidden; }
    .nav-button { color: var(--green); border: 1px solid var(--green); border-radius: 5px; background: #00190733; cursor: pointer; min-height: 44px; padding: 11px 16px; font-size: 16px; transition: background .18s, box-shadow .18s; }
    a.nav-button { display: flex; align-items: center; justify-content: center; text-decoration: none; }
    .nav-button:hover { background: #00ff6614; box-shadow: 0 0 20px #00ff661b, inset 0 0 16px #00ff6609; }
    :focus-visible { outline: 2px solid #b5ffcf; outline-offset: 6px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    @media (max-width: 600px) {
      .screen { padding: 88px 20px 40px; }
      .navigation { grid-template-columns: 1fr; gap: 12px; width: min(240px, 100%); margin-top: 32px; }
      .nav-button { font-size: 15px; padding: 11px 14px; }
    }
    /* Учитываем системную настройку: убираем печать, мигание и переходы. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body data-page="home">
  <div class="language-switch" role="group" aria-label="Language / Язык">
    <button type="button" data-language="ru" lang="ru" aria-label="Русский" aria-pressed="false">RU</button>
    <button type="button" data-language="en" lang="en" aria-label="English" aria-pressed="false">EN</button>
  </div>
  <main class="screen">
    <div class="terminal">
      <h1 class="sr-only" data-i18n="heading">Личный сайт — разработчик, проекты и веб-сайты</h1>
      <!-- Посимвольная анимация скрыта от скринридера, чтобы не зачитывать каждую букву. -->
      <div class="terminal-output" aria-hidden="true">
        <p class="prompt"><span>&gt;</span><span class="typed-line" id="typed-line" data-reserve="Вход разрешен."><span class="typed-content"><span id="terminal-text">Вход разрешен.</span><span class="cursor"></span></span></span></p>
      </div>
      <p class="sr-only" data-i18n="terminalSummary">Вход разрешен. Добро пожаловать в репозиторий Slipcast-Dev. Анимация строки терминала macOS.</p>
      <nav class="navigation" aria-label="Разделы сайта" data-i18n-label="sections">
        <a class="nav-button" href="developer.html" data-i18n="developer">Разработчик</a>
        <a class="nav-button" href="projects.html" data-i18n="projects">Проекты</a>
        <a class="nav-button" href="websites.html" data-i18n="websites">Вэб-сайты</a>
      </nav>
      <noscript><p>Для анимации включите JavaScript. / Enable JavaScript for the animation.</p></noscript>
    </div>
  </main>
  <script>
    'use strict';
    const terminalText = document.querySelector('#terminal-text');
    const typedLine = document.querySelector('#typed-line');
    const navigation = document.querySelector('.navigation');
    const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
    const i18n = window.siteI18n;
    const introduction = ['access', 'welcome'];
    const output = document.querySelector('.terminal-output');
    // Декоративные строки: команды не передаются системе и не выполняются.
    const commands = [
      'system_profiler SPHardwareDataType',
      'defaults read -g AppleLanguages',
      'diskutil info / | grep "File System"',
      'log show --last 5m --style compact',
      'find ~/Projects -maxdepth 2 -type d',
      'journalctl --user --since today',
      'systemctl list-units --type=service',
      'ps aux --sort=-%mem | head -n 10',
      'find /etc -maxdepth 2 -name "*.conf"',
      'git log --oneline --graph --all -n 20',
      'git diff --stat --cached',
      'gh repo list Slipcast-dev --visibility public',
      'gh release list --repo Slipcast-dev/Grizzly',
      'gh pr list --repo Slipcast-dev/Grizzly --state open'
    ];
    let navigationVisible = document.documentElement.classList.contains('navigation-ready');
    let mode = navigationVisible ? 'commands' : 'intro';
    let itemIndex = 0;
    let position = 0;
    let phase = 'typing';
    let timer;

    function revealNavigation() {
      if (navigationVisible) return;
      navigationVisible = true;
      try {
        sessionStorage.setItem('slipcast-navigation-seen', '1');
      } catch {
        // Отказ хранилища не должен прерывать анимацию и обработчики навигации.
      }
      navigation.classList.remove('pending');
      navigation.inert = false;
    }

    function currentText() {
      return mode === 'intro' ? i18n.t(introduction[itemIndex]) : commands[itemIndex];
    }

    function renderLine() {
      const text = currentText();
      typedLine.dataset.reserve = text;
      output.style.setProperty('--line-units', String(Math.max(28, (text.length + 4) * .65)));
      terminalText.textContent = text.slice(0, position);
      terminalText.lang = mode === 'intro' ? i18n.language : 'en';
    }

    // Один таймер проводит вступление и бесконечный цикл команд через общие состояния.
    function tick() {
      const text = currentText();
      let delay = mode === 'intro' ? 68 : 85;
      if (phase === 'typing') {
        position++;
        if (position === text.length) {
          phase = 'holding';
          delay = mode === 'intro' ? 1300 : 1900;
          if (mode === 'intro' && itemIndex === introduction.length - 1) revealNavigation();
        }
      } else if (phase === 'holding') {
        phase = 'deleting';
        delay = 28;
      } else if (phase === 'deleting') {
        position--;
        delay = 28;
        if (position === 0) {
          phase = 'gap';
          delay = 350;
        }
      } else {
        itemIndex++;
        if (mode === 'intro' && itemIndex === introduction.length) {
          mode = 'commands';
          itemIndex = 0;
        } else if (mode === 'commands') {
          itemIndex %= commands.length;
        }
        phase = 'typing';
        delay = 100;
      }
      renderLine();
      timer = window.setTimeout(tick, delay);
    }

    function synchronizeAnimation() {
      window.clearTimeout(timer);
      if (motionPreference.matches) {
        // При уменьшении движения приветствие статично, навигация сразу доступна.
        mode = 'intro';
        itemIndex = introduction.length - 1;
        position = currentText().length;
        phase = 'holding';
        renderLine();
        revealNavigation();
        return;
      }
      if (document.hidden) return;
      if (!navigationVisible) {
        navigation.classList.add('pending');
        navigation.inert = true;
      }
      renderLine();
      timer = window.setTimeout(tick, 450);
    }

    document.addEventListener('languagechange', () => {
      // Смена языка перезапускает только текущую вступительную фразу, сохраняя доступность кнопок.
      if (mode === 'intro') { position = 0; phase = 'typing'; }
      synchronizeAnimation();
    });
    motionPreference.addEventListener('change', synchronizeAnimation);
    document.addEventListener('visibilitychange', synchronizeAnimation);
    synchronizeAnimation();
  </script>
</body>
</html>
