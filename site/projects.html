<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="https://slipcast-dev.github.io/projects.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://slipcast-dev.github.io/projects.html">
  <meta property="og:site_name" content="Slipcast-Dev">
  <meta property="og:image" content="https://slipcast-dev.github.io/assets/avatar.jpg">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Публичные проекты Slipcast-dev: версии, названия и описания из GitHub.">
  <title>Проекты — Личный терминал</title>
  <script src="i18n.js"></script>
  <style>
    .language-switch { position: absolute; z-index: 2; top: 18px; right: 22px; display: flex; gap: 4px; padding: 3px; border: 1px solid #00ff6640; border-radius: 5px; background: #000; }
    .language-switch button { min-height: 38px; min-width: 42px; padding: 6px 10px; border: 1px solid transparent; border-radius: 3px; background: transparent; color: #77a98a; font: inherit; font-size: 12px; cursor: pointer; }
    .language-switch button[aria-pressed="true"] { color: #00ff66; background: #00ff6612; border-color: #00ff6660; }
    .language-switch button:hover { color: #00ff66; background: #00ff661a; }
    :root { color-scheme: dark; --green: #00ff66; --text: #d2ebdc; --muted: #88a693; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; color: var(--text); font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid var(--green); outline-offset: 6px; }
    .topbar { border-bottom: 1px solid #00ff6614; }
    .topbar-inner { max-width: 1120px; min-height: 64px; margin: auto; padding: 0 150px 0 28px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .home-link { display: inline-flex; align-items: center; min-height: 44px; font-size: 13px; color: #9fbeaa; transition: color .2s; }
    .home-link:hover { color: var(--green); }
    .path { font-size: 12px; color: var(--green); letter-spacing: .04em; }
    main { width: min(1000px, calc(100% - 64px)); margin: 0 auto; padding: 116px 0 64px; }
    .intro { width: 100%; text-align: center; margin: 0 auto 58px; }
    h1 { margin: 0; color: var(--green); font-size: clamp(25px, 3.8vw, 36px); line-height: 1.4; font-weight: 700; }
    .intro p { max-width: 650px; margin: 18px auto 0; color: var(--muted); font-size: 13px; line-height: 1.9; }
    .project-search { width: min(640px, 100%); margin: 28px auto 0; display: flex; align-items: center; gap: 12px; padding: 0 16px; border: 1px solid #00ff6650; border-radius: 5px; background: #00ff6608; text-align: left; transition: border-color .2s, box-shadow .2s; }
    .project-search:focus-within { border-color: var(--green); box-shadow: 0 0 18px #00ff6618; }
    .search-prompt { flex: none; color: var(--green); font-size: 16px; }
    .project-search input { width: 100%; min-width: 0; min-height: 48px; padding: 12px 0; border: 0; outline: none; background: transparent; color: #d8ffe6; caret-color: var(--green); font: inherit; font-size: 16px; line-height: 1.5; }
    .project-search input::placeholder { color: #88a693; opacity: 1; }
    .project-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 24px; }
    /* Наклонная грань и градиент повторяют геометрию референса без наклона текста. */
    .project-card { position: relative; isolation: isolate; min-height: 120px; padding: 18px 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transition: filter .22s ease; }
    .project-card::before { content: ""; position: absolute; z-index: -1; inset: 0; background: linear-gradient(105deg, #00ff660d, #00ff6605 60%, #0000); clip-path: polygon(28px 0, 100% 0, calc(100% - 28px) 100%, 0 100%); background-color: transparent; transition: background-color .22s ease; }
    .project-card::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 32px; background: var(--green); opacity: .72; clip-path: polygon(28px 0, 32px 0, 4px 100%, 0 100%); transition: opacity .2s; }
    /* Подсветка ограничена наведённой карточкой и использует только зелёную палитру. */
    .project-card:is(:hover, :focus-visible) { filter: drop-shadow(0 0 18px #00ff6626); }
    .project-card:is(:hover, :focus-visible)::before { background-color: #00ff6624; }
    .project-card:is(:hover, :focus-visible)::after { opacity: 1; }
    .project-card:is(:hover, :focus-visible) h2 { color: var(--green); }
    .project-card:is(:hover, :focus-visible) .status { color: #a0ffc4; }
    .project-card:is(:hover, :focus-visible) p { color: #c2ebd2; }
    .status { color: #92e6b3; text-transform: none; letter-spacing: .14em; font-size: 11px; line-height: 1.7; }
    h2 { margin: 6px 0 8px; color: #d8ffe6; font-size: clamp(18px, 2.5vw, 22px); line-height: 1.4; font-weight: 600; }
    .project-card p { max-width: 760px; margin: 0; color: #9ab8a5; font-size: 14px; line-height: 1.85; }
    .project-card h2, .project-card .status, .project-card p { transition: color .22s ease; }
    .load-status { text-align: center; color: var(--muted); font-size: 13px; line-height: 1.8; margin: 0 0 32px; }
    .load-status:empty { display: none; }
    .project-card h2 { overflow-wrap: anywhere; max-width: 100%; }
    .project-card { color: inherit; }
    .end { display: flex; justify-content: center; margin-top: 54px; }
    .back { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; border: 1px solid #00ff6670; border-radius: 5px; padding: 11px 20px; color: var(--green); font-size: 13px; transition: background .2s; }
    .back:hover { background: #00ff6614; }
    @media (max-width: 600px) {
      .topbar-inner { padding: 0 136px 0 20px; min-height: 78px; gap: 12px; }
      .path { display: none; }
      main { width: calc(100% - 36px); padding-top: 72px; }
      .intro { margin-bottom: 38px; }
      .intro p { font-size: 12px; padding: 0 8px; }
      .project-list { gap: 18px; }
      .project-card { min-height: 132px; padding: 16px 28px; }
      .project-card p { font-size: 12px; }
      .status { font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body data-page="projects">
  <div class="language-switch" role="group" aria-label="Language / Язык">
    <button type="button" data-language="ru" lang="ru" aria-label="Русский" aria-pressed="false">RU</button>
    <button type="button" data-language="en" lang="en" aria-label="English" aria-pressed="false">EN</button>
  </div>
  <header class="topbar">
    <nav class="topbar-inner" aria-label="Навигация сайта" data-i18n-label="navigation">
      <a class="home-link" href="index.html" data-i18n="terminal">← Терминал</a>
      <a class="path" href="projects.html" aria-current="page">~/projects</a>
    </nav>
  </header>
  <main>
    <header class="intro">
      <h1 data-i18n="developmentLog">Журнал разработок</h1>
      <div class="project-search" role="search" aria-label="Поиск проектов" data-i18n-label="searchProjects">
        <span class="search-prompt" aria-hidden="true">&gt;_</span>
        <input id="project-search" type="search" name="q" placeholder="Найти проект…" data-i18n-placeholder="searchProjectsPlaceholder" aria-label="Поиск по названию, описанию или версии" data-i18n-label="searchProjectsLabel" aria-controls="project-list" autocomplete="off" spellcheck="false">
      </div>
    </header>
    <p id="load-status" class="load-status" role="status" data-i18n="loadingProjects">Загрузка публичных проектов…</p>
    <ol id="project-list" class="project-list" aria-label="Публичные проекты Slipcast-dev" data-i18n-label="projectList" aria-busy="true"></ol>
    <noscript><p class="load-status">Включите JavaScript для загрузки проектов. / Enable JavaScript to load projects. <a href="https://github.com/Slipcast-dev?tab=repositories">GitHub repositories / Репозитории GitHub</a>.</p></noscript>
    <footer class="end"><a class="back" href="index.html" data-i18n="back">← Назад в терминал</a></footer>
  </main>

  <script src="projects-data.js"></script>
  <script src="projects-api.js"></script>
  <script>
    'use strict';
    const i18n = window.siteI18n;
    const list = document.querySelector('#project-list');
    const status = document.querySelector('#load-status');
    const search = document.querySelector('#project-search');
    let currentSnapshot = null;
    let loading = false;
    let lastAttempt = 0;
    let lastLiveAttempt = 0;

    function validProject(repo) {
      if (!repo || repo.private !== false || repo.owner?.login?.toLowerCase() !== 'slipcast-dev'
          || !Number.isInteger(repo.id) || typeof repo.name !== 'string' || !repo.name.length) return false;
      const topics = Array.isArray(repo.topics) ? repo.topics : [];
      return repo.name.toLowerCase() !== 'slipcast-dev'
        && !/(^|[-_.])(website|web-site|site|landing|landing-page)([-_.]|$)/i.test(repo.name)
        && !repo.name.toLowerCase().endsWith('.github.io')
        && !topics.some(topic => typeof topic === 'string' && ['website', 'web-site', 'landing-page', 'github-pages'].includes(topic.toLowerCase()));
    }

    // Общий ключ поиска: транслитерация и распространённые варианты латинских букв.
    // Схлопываем только буквы: версии и другие числа должны сохранять все цифры.
    function searchKey(value) {
      const letters = {
        а: 'a', б: 'b', в: 'v', г: 'g', д: 'd', е: 'e', ё: 'e', ж: 'zh',
        з: 'z', и: 'i', й: 'i', к: 'k', л: 'l', м: 'm', н: 'n', о: 'o',
        п: 'p', р: 'r', с: 's', т: 't', у: 'u', ф: 'f', х: 'kh', ц: 'ts',
        ч: 'ch', ш: 'sh', щ: 'shch', ъ: '', ы: 'i', ь: '', э: 'e', ю: 'yu', я: 'ya'
      };
      return value.replace(/[а-яё]/g, letter => letters[letter])
        .replace(/ph/g, 'f').replace(/ck/g, 'k').replace(/c(?=[eiy])/g, 's')
        .replace(/c(?!h)|q/g, 'k').replace(/x/g, 'ks').replace(/w/g, 'v')
        .replace(/y/g, 'i').replace(/([a-z])\1+/g, '$1');
    }

    function renderProjects(snapshot) {
      if (!snapshot || !Array.isArray(snapshot.repositories)) throw new Error('Invalid public project snapshot');
      currentSnapshot = snapshot;
      // Все слова запроса должны встретиться в данных карточки; ввод не превращается в HTML или регулярное выражение.
      const normalize = value => value.normalize('NFKC').toLowerCase();
      const terms = normalize(search.value || '').trim().split(/\s+/).filter(Boolean)
        .map(term => ({ original: term, key: searchKey(term) }));
      const projects = snapshot.repositories.filter(validProject);
      const matches = projects.filter(repo => {
        const text = normalize([repo.name, repo.description, repo.version].filter(value => typeof value === 'string').join(' '));
        const key = searchKey(text);
        return terms.every(term => text.includes(term.original) || (term.key.length > 0 && key.includes(term.key)));
      });
      const cards = matches.map(repo => {
        const item = document.createElement('li');
        const card = document.createElement('a');
        card.className = 'project-card';
        card.href = `https://github.com/Slipcast-dev/${encodeURIComponent(repo.name)}`;
        const version = document.createElement('span');
        version.className = 'status';
        if (typeof repo.version === 'string' && repo.version.trim()) version.textContent = repo.version;
        else i18n.message(version, 'noRelease');
        const title = document.createElement('h2');
        title.textContent = repo.name;
        const description = document.createElement('p');
        if (typeof repo.description === 'string' && repo.description.trim()) description.textContent = repo.description;
        else i18n.message(description, 'noDescription');
        card.append(version, title, description);
        item.append(card);
        return item;
      });
      list.replaceChildren(...cards);
      i18n.message(status, cards.length ? null : projects.length ? 'noMatchingProjects' : 'emptyProjects');
      list.setAttribute('aria-busy', 'false');
    }

    async function refreshProjects() {
      // Снимок публикации служит резервом. Свежие данные читаем независимо от расписания Actions.
      if (loading || document.hidden || location.protocol === 'file:') return;
      if (Date.now() - lastAttempt < 2 * 60 * 1000) return;
      loading = true;
      lastAttempt = Date.now();
      try {
        const response = await fetch('projects.json', { cache: 'no-cache', credentials: 'omit', signal: AbortSignal.timeout(12000) });
        if (!response.ok) throw new Error(`Snapshot HTTP ${response.status}`);
        const snapshot = await response.json();
        // Старая публикация не должна затирать уже полученные свежие данные GitHub.
        if (!currentSnapshot?.fetchedAt || Date.parse(snapshot.fetchedAt) > Date.parse(currentSnapshot.fetchedAt)) {
          renderProjects(snapshot);
        }
      } catch {
        // Ошибка сети не убирает карточки: начальный снимок уже загружен локальным JS.
      }
      try {
        // Ограничиваем обращения без токена: для шести проектов это около 28 запросов в час.
        // При ошибке не применяем частичный результат и сохраняем карточки.
        if (Date.now() - lastLiveAttempt >= 15 * 60 * 1000) {
          lastLiveAttempt = Date.now();
          try { sessionStorage.setItem('projects-live-attempt', String(lastLiveAttempt)); } catch {}
          const snapshot = await globalThis.publicProjectsApi.collectProjects();
          renderProjects(snapshot);
          try { sessionStorage.setItem('projects-live-snapshot', JSON.stringify(snapshot)); } catch {}
        }
      } catch {
        // Лимит API или сбой сети допускает повтор через 15 минут.
      } finally {
        loading = false;
      }
    }
    search.addEventListener('input', () => renderProjects(currentSnapshot));
    search.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        search.value = '';
        renderProjects(currentSnapshot);
      }
    });
    renderProjects(window.publicProjectsSnapshot);
    // Переходы между страницами и перезагрузка вкладки не расходуют лимит повторно.
    try {
      const cached = JSON.parse(sessionStorage.getItem('projects-live-snapshot') || 'null');
      if (cached && Date.parse(cached.fetchedAt) > Date.parse(currentSnapshot.fetchedAt)) renderProjects(cached);
      lastLiveAttempt = Number(sessionStorage.getItem('projects-live-attempt')) || 0;
    } catch {
      // Хранилище может быть запрещено настройками браузера.
    }
    setInterval(refreshProjects, 60 * 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshProjects(); });
    refreshProjects();
  </script>
</body>
</html>
