<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="https://slipcast-dev.github.io/projects.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://slipcast-dev.github.io/projects.html">
  <meta property="og:site_name" content="Slipcast-Dev">
  <meta property="og:image" content="https://slipcast-dev.github.io/assets/avatar.jpg">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Публичные проекты Slipcast-dev: версии, названия и описания из GitHub.">
  <title>Проекты — Личный терминал</title>
  <script src="i18n.js"></script>
  <style>
    .language-switch { position: absolute; z-index: 2; top: 18px; right: 22px; display: flex; gap: 4px; padding: 3px; border: 1px solid #00ff6640; border-radius: 5px; background: #000; }
    .language-switch button { min-height: 38px; min-width: 42px; padding: 6px 10px; border: 1px solid transparent; border-radius: 3px; background: transparent; color: #77a98a; font: inherit; font-size: 12px; cursor: pointer; }
    .language-switch button[aria-pressed="true"] { color: #00ff66; background: #00ff6612; border-color: #00ff6660; }
    .language-switch button:hover { color: #00ff66; background: #00ff661a; }
    :root { color-scheme: dark; --green: #00ff66; --text: #d2ebdc; --muted: #88a693; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; color: var(--text); font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid var(--green); outline-offset: 6px; }
    main { width: min(880px, calc(100% - 48px)); margin: 0 auto; padding: 72px 0 56px; }
    .intro { text-align: center; margin: 0 auto 32px; }
    h1 { margin: 0; color: var(--green); font-size: clamp(25px, 3.8vw, 36px); line-height: 1.4; font-weight: 700; }
    .project-search { width: min(640px, 100%); margin: 28px auto 0; display: flex; align-items: center; gap: 12px; padding: 0 16px; border: 1px solid #00ff6650; border-radius: 5px; background: #00ff6608; text-align: left; transition: border-color .2s, box-shadow .2s; }
    .project-search:focus-within { border-color: var(--green); box-shadow: 0 0 18px #00ff6618; }
    .search-prompt { flex: none; color: var(--green); font-size: 16px; }
    .project-search input { width: 100%; min-width: 0; min-height: 48px; padding: 12px 0; border: 0; outline: none; background: transparent; color: #d8ffe6; caret-color: var(--green); font: inherit; font-size: 16px; line-height: 1.5; }
    .project-search input::placeholder { color: #88a693; opacity: 1; }
    .project-list { list-style: none; margin: 0; padding: 0; border: 1px solid #00ff6645; border-radius: 5px; }
    .project-list:empty { border: 0; }
    /* Описание занимает отдельную колонку. Сборки остаются самостоятельными ссылками. */
    .project-card { position: relative; isolation: isolate; display: grid; grid-template-columns: minmax(0, 1fr) minmax(230px, .63fr); gap: 24px; align-items: start; padding: 14px 16px 14px 30px; transition: background .18s ease; }
    .project-card + .project-card { border-top: 1px solid #00ff6630; }
    .project-card:nth-child(even) { background: #040c06; }
    .project-card:is(:hover, :focus-within) { background: #091c10; }
    .project-card > :first-child { min-width: 0; }
    .project-card > :only-child { grid-column: 1 / -1; }
    .project-card h2 { position: relative; margin: 0 0 5px; color: #d8ffe6; font-size: clamp(15px, 2.4vw, 19px); font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
    .project-card h2::before { content: "›" / ""; position: absolute; left: -18px; color: var(--green); }
    .project-card:is(:hover, :focus-within) h2 { color: var(--green); }
    .project-card p { max-width: 72ch; margin: 0; color: #b0ccb9; font-size: 14px; line-height: 1.65; overflow-wrap: anywhere; }
    .status { align-self: center; color: #92e6b3; font-size: 11px; line-height: 1.5; }
    .load-status { text-align: center; color: var(--muted); font-size: 13px; line-height: 1.8; margin: 0 0 24px; }
    .load-status:empty { display: none; }
    /* Основная ссылка покрывает строку. Ссылки отдельных сборок находятся над ней. */
    .project-card > a::after { content: ""; position: absolute; inset: 0; }
    .project-card > a:focus-visible { outline: none; }
    .project-card > a:focus-visible::after { outline: 2px solid var(--green); outline-offset: -2px; }
    .download-options { display: grid; align-self: center; align-content: start; border-left: 1px solid #00ff6635; padding-left: 12px; }
    .download-options a { position: relative; display: grid; gap: 2px; align-content: center; min-height: 34px; padding: 5px 6px; border-radius: 3px; color: var(--green); font-size: 12px; line-height: 1.4; overflow-wrap: anywhere; }
    .download-options a:hover { background: #00ff6614; }
    .download-options a:focus-visible { outline-offset: -2px; }
    .download-label { text-decoration: underline; text-underline-offset: 3px; }
    .download-info { color: #92ae9c; font-size: 11px; line-height: 1.5; }
    .download-info:empty { display: none; }
    .back { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; border: 1px solid #00ff6670; border-radius: 5px; padding: 11px 20px; color: var(--green); font-size: 13px; transition: background .2s; }
    .intro .back { margin-top: 14px; }
    .back:hover { background: #00ff6614; }
    @media (max-width: 600px) {
      main { width: calc(100% - 28px); padding-top: 80px; }
      .intro { margin-bottom: 22px; }
      .project-card { grid-template-columns: minmax(0, 1fr); gap: 9px; padding: 12px 12px 12px 25px; }
      .project-card h2::before { left: -14px; }
      .download-options { border-left: 0; border-top: 1px solid #00ff6635; padding: 4px 0 0; }
      .download-options a { min-height: 42px; padding-right: 0; padding-left: 0; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body data-page="projects">
  <div class="language-switch" role="group" aria-label="Language / Язык">
    <button type="button" data-language="ru" lang="ru" aria-label="Русский" aria-pressed="false">RU</button>
    <button type="button" data-language="en" lang="en" aria-label="English" aria-pressed="false">EN</button>
  </div>
  <main>
    <header class="intro">
      <h1 data-i18n="developmentLog">Журнал разработок</h1>
      <a class="back" href="index.html" data-i18n="back">← Назад в терминал</a>
      <div class="project-search" role="search" aria-label="Поиск проектов" data-i18n-label="searchProjects">
        <span class="search-prompt" aria-hidden="true">&gt;_</span>
        <input id="project-search" type="search" name="q" placeholder="Найти проект…" data-i18n-placeholder="searchProjectsPlaceholder" aria-label="Поиск по названию, описанию или версии" data-i18n-label="searchProjectsLabel" aria-controls="project-list" autocomplete="off" spellcheck="false">
      </div>
    </header>
    <p id="load-status" class="load-status" role="status" data-i18n="loadingProjects">Загрузка публичных проектов…</p>
    <ol id="project-list" class="project-list" aria-label="Публичные проекты Slipcast-dev" data-i18n-label="projectList" aria-busy="true"></ol>
    <noscript><p class="load-status">Включите JavaScript для загрузки проектов. / Enable JavaScript to load projects. <a href="https://github.com/Slipcast-dev?tab=repositories">GitHub repositories / Репозитории GitHub</a>.</p></noscript>
  </main>

  <script src="projects-data.js"></script>
  <script src="projects-api.js"></script>
  <script>
    'use strict';
    const i18n = window.siteI18n;
    const list = document.querySelector('#project-list');
    const status = document.querySelector('#load-status');
    const search = document.querySelector('#project-search');
    const snapshotRefreshInterval = 2 * 60 * 1000;
    let currentSnapshot = null;
    let loading = false;
    let lastAttempt = 0;
    let lastLiveAttempt = 0;
    let retryLiveAt = 0;

    function validProject(repo) {
      if (!repo || repo.private !== false || repo.owner?.login?.toLowerCase() !== 'slipcast-dev'
          || !Number.isInteger(repo.id) || typeof repo.name !== 'string' || !repo.name.length) return false;
      return repo.name.toLowerCase() !== 'slipcast-dev'
        && !globalThis.publicProjectsApi.isWebsite(repo)
        && !globalThis.publicProjectsApi.isSkillCollection(repo)
        && !globalThis.publicProjectsApi.isHiddenProject(repo);
    }

    // Общий ключ поиска: транслитерация и распространённые варианты латинских букв.
    // Схлопываем только буквы: версии и другие числа должны сохранять все цифры.
    function searchKey(value) {
      const letters = {
        а: 'a', б: 'b', в: 'v', г: 'g', д: 'd', е: 'e', ё: 'e', ж: 'zh',
        з: 'z', и: 'i', й: 'i', к: 'k', л: 'l', м: 'm', н: 'n', о: 'o',
        п: 'p', р: 'r', с: 's', т: 't', у: 'u', ф: 'f', х: 'kh', ц: 'ts',
        ч: 'ch', ш: 'sh', щ: 'shch', ъ: '', ы: 'i', ь: '', э: 'e', ю: 'yu', я: 'ya'
      };
      return value.replace(/[а-яё]/g, letter => letters[letter])
        .replace(/ph/g, 'f').replace(/ck/g, 'k').replace(/c(?=[eiy])/g, 's')
        .replace(/c(?!h)|q/g, 'k').replace(/x/g, 'ks').replace(/w/g, 'v')
        .replace(/y/g, 'i').replace(/([a-z])\1+/g, '$1');
    }

    function formatDownloadSize(bytes) {
      const unit = bytes >= 1_000_000 ? 'megabyte' : bytes >= 1_000 ? 'kilobyte' : 'byte';
      const divisor = { megabyte: 1_000_000, kilobyte: 1_000, byte: 1 }[unit];
      return new Intl.NumberFormat(i18n.language, {
        style: 'unit', unit, unitDisplay: 'short', maximumFractionDigits: 1
      }).format(bytes / divisor);
    }

    function renderProjects(snapshot) {
      if (!snapshot || !Array.isArray(snapshot.repositories)) throw new Error('Invalid public project snapshot');
      currentSnapshot = snapshot;
      // Все слова запроса должны встретиться в данных карточки; ввод не превращается в HTML или регулярное выражение.
      const normalize = value => value.normalize('NFKC').toLowerCase();
      const terms = normalize(search.value || '').trim().split(/\s+/).filter(Boolean)
        .map(term => ({ original: term, key: searchKey(term) }));
      const projects = snapshot.repositories.filter(validProject);
      const matches = projects.filter(repo => {
        const text = normalize([repo.name, i18n.projectDescription(repo.id), repo.description, repo.version].filter(value => typeof value === 'string').join(' '));
        const key = searchKey(text);
        return terms.every(term => text.includes(term.original) || (term.key.length > 0 && key.includes(term.key)));
      });
      const cards = matches.map(repo => {
        const item = document.createElement('li');
        item.className = 'project-card';
        const builds = globalThis.publicProjectsApi.projectDownloads(repo);
        const device = navigator.userAgentData?.platform || navigator.platform || '';
        const platform = /win/i.test(device) ? 'windows' : /mac/i.test(device) ? 'mac'
          : /linux/i.test(device) ? 'linux' : null;
        // macOS не всегда раскрывает архитектуру браузеру. Показываем обе сборки, если они есть.
        const main = builds.find(build => build.platform === platform) || builds[0];
        const card = document.createElement(main ? 'a' : 'div');
        if (main) {
          card.href = main.url;
          card.setAttribute('download', '');
        }
        const title = document.createElement('h2');
        title.textContent = repo.name;
        const description = document.createElement('p');
        const descriptionText = i18n.projectDescription(repo.id)
          || (typeof repo.description === 'string' ? repo.description.trim() : '');
        if (descriptionText) description.textContent = descriptionText;
        else i18n.message(description, 'noDescription');
        card.append(title, description);
        item.append(card);
        if (builds.length) {
          const options = document.createElement('div');
          options.className = 'download-options';
          for (const build of builds) {
            const link = document.createElement('a');
            link.href = build.url;
            link.setAttribute('download', '');
            const label = document.createElement('span');
            label.className = 'download-label';
            i18n.message(label, 'download' + build.key);
            const info = document.createElement('span');
            info.className = 'download-info';
            info.textContent = [repo.version, build.size && formatDownloadSize(build.size), build.compatibility]
              .filter(Boolean).join(' · ');
            link.append(label, info);
            options.append(link);
          }
          item.append(options);
        } else if (!repo.version) {
          const releaseStatus = document.createElement('span');
          releaseStatus.className = 'status';
          i18n.message(releaseStatus, repo.releaseState === 'loading' ? 'loadingVersion'
            : repo.releaseState === 'unavailable' ? 'versionUnavailable' : 'noRelease');
          item.append(releaseStatus);
        }
        return item;
      });
      list.replaceChildren(...cards);
      i18n.message(status, cards.length ? null : projects.length ? 'noMatchingProjects' : 'emptyProjects');
      list.setAttribute('aria-busy', 'false');
    }

    async function refreshProjects() {
      // Снимок публикации служит резервом. Свежие данные читаем независимо от расписания Actions.
      if (loading || document.hidden || location.protocol === 'file:') return;
      if (Date.now() - lastAttempt < snapshotRefreshInterval) return;
      loading = true;
      lastAttempt = Date.now();
      // Локальный снимок не задерживает прямой запрос к GitHub при медленном соединении.
      const snapshotRequest = (async () => {
        try {
          const response = await fetch('projects.json', { cache: 'no-cache', credentials: 'omit', signal: AbortSignal.timeout(12000) });
          if (!response.ok) throw new Error(`Snapshot HTTP ${response.status}`);
          const snapshot = await response.json();
          // Старая публикация не должна затирать уже полученные свежие данные GitHub.
          if (!currentSnapshot?.fetchedAt || Date.parse(snapshot.fetchedAt) > Date.parse(currentSnapshot.fetchedAt)) {
            renderProjects(snapshot);
          }
        } catch {
          // Ошибка сети не убирает карточки: начальный снимок уже загружен локальным JS.
        }
      })();
      try {
        // Список проверяется раз в две минуты. Сборщик использует кеш релизов
        // и сообщает готовые карточки, пока остальные запросы ещё выполняются.
        if (Date.now() >= retryLiveAt && Date.now() - lastLiveAttempt >= snapshotRefreshInterval) {
          lastLiveAttempt = Date.now();
          try { sessionStorage.setItem('projects-live-attempt', String(lastLiveAttempt)); } catch {}
          const applySnapshot = snapshot => {
            renderProjects(snapshot);
            try { sessionStorage.setItem('projects-live-snapshot', JSON.stringify(snapshot)); } catch {}
          };
          await globalThis.publicProjectsApi.collectProjects({
            previousSnapshot: currentSnapshot,
            tolerateReleaseErrors: true,
            onProgress: applySnapshot
          });
        }
      } catch (error) {
        if ([403, 429].includes(error.status)) {
          retryLiveAt = error.retryAt;
          try { sessionStorage.setItem('projects-live-retry-at', String(retryLiveAt)); } catch {}
        }
        // При сбое сохраняем последние данные до следующей попытки.
      } finally {
        await snapshotRequest;
        loading = false;
      }
    }
    document.addEventListener('languagechange', () => { if (currentSnapshot) renderProjects(currentSnapshot); });
    search.addEventListener('input', () => renderProjects(currentSnapshot));
    search.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        search.value = '';
        renderProjects(currentSnapshot);
      }
    });
    renderProjects(window.publicProjectsSnapshot);
    // Переходы между страницами и перезагрузка вкладки не расходуют лимит повторно.
    try {
      const cached = JSON.parse(sessionStorage.getItem('projects-live-snapshot') || 'null');
      if (cached?.repositories?.every(repo => Array.isArray(repo.downloads)) && Date.parse(cached.fetchedAt) > Date.parse(currentSnapshot.fetchedAt)) renderProjects(cached);
      lastLiveAttempt = Number(sessionStorage.getItem('projects-live-attempt')) || 0;
      retryLiveAt = Number(sessionStorage.getItem('projects-live-retry-at')) || 0;
    } catch {
      // Хранилище может быть запрещено настройками браузера.
    }
    setInterval(refreshProjects, 60 * 1000);
    // Возврат к странице проверяет GitHub раньше фонового цикла, если данные уже могли измениться.
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) refreshProjects();
    });
    refreshProjects();
  </script>
</body>
</html>
