name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # GitHub использует UTC: 06:17 соответствует 09:17 по Минску.
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Обновляем только сборку: workflow не получает токен записи и не делает коммиты.
      - run: npm run sync:projects
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      - run: npm run validate
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  hosting:
    name: Check GitHub Pages availability
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        name: Check configured Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 404 означает отсутствие сайта или доступа по тарифу; это не ошибка сборки.
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          if [ "$status" = '200' ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          elif [ "$status" = '404' ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Publication skipped: GitHub Pages is unavailable. Check the repository plan and Settings > Pages.'
            echo '### Publication skipped' >> "$GITHUB_STEP_SUMMARY"
            echo 'Build and tests passed. GitHub Pages is unavailable for this repository. Check plan support for private repositories and enable GitHub Actions in Settings > Pages.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Cannot check GitHub Pages (HTTP $status)."
            exit 1
          fi

  deploy:
    needs: [build, hosting]
    if: needs.hosting.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
