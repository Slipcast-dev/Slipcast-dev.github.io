name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # GitHub использует UTC: 06:17 соответствует 09:17 по Минску.
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Зависимости сборки не должны читать токен из локального Git config.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Запрещаем install-скрипты зависимостей; сборка использует готовые бинарные пакеты.
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      # Обновляем только сборку: workflow не получает токен записи и не делает коммиты.
      - run: npm run sync:projects
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      - run: npm run validate
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  hosting:
    name: Check GitHub Pages availability
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    timeout-minutes: 2
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        name: Check configured Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Не меняем видимость репозитория и не пытаемся включить платный сервис.
          status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          if [ "$status" = '200' ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          elif [ "$status" = '404' ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Publication skipped: GitHub Pages is unavailable. Check visibility, plan support and Settings > Pages.'
            echo '### Publication unavailable' >> "$GITHUB_STEP_SUMMARY"
            echo 'Build and security checks passed. Deploy was skipped because GitHub Pages is not configured or supported for this repository. Repository visibility was not changed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Cannot check GitHub Pages (HTTP $status)."
            exit 1
          fi

  deploy:
    needs: [build, hosting]
    if: needs.hosting.outputs.enabled == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
